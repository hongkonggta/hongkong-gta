<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>香港GTA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Microsoft JhengHei", "PingFang HK", sans-serif; color: #fff; }
  canvas { display: block; }

  /* 頂部備註 */
  .top-note {
    position: fixed; top: 0; left: 0; width: 100%;
    text-align: center; font-size: 11px; color: rgba(255,255,255,0.4);
    padding: 6px 0; letter-spacing: 1px; z-index: 5;
    pointer-events: none;
  }

  /* 主選單 */
  #startMenu {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, #1a1a2e 0%, #03030a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 10;
  }
  #startMenu .hk-stamp {
    position: absolute; left: 24px; top: 40%;
    background: #c0392b; color: #fff; font-weight: 900;
    font-size: 42px; padding: 10px 14px; letter-spacing: 4px;
    writing-mode: vertical-rl; border: 3px solid #fff;
    box-shadow: 0 0 0 3px #c0392b;
  }
  #startMenu h1 {
    font-size: 110px; color: #fff; letter-spacing: 6px;
    text-shadow: 6px 6px 0 #c0392b, 12px 12px 20px rgba(0,0,0,0.8);
    margin-bottom: 10px;
  }
  #startMenu .sub {
    font-size: 22px; color: #f5d16a; letter-spacing: 8px; margin-bottom: 40px;
  }
  .menu-btn {
    width: 280px; padding: 14px; margin: 8px 0;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff; font-size: 16px; letter-spacing: 3px;
    cursor: pointer; backdrop-filter: blur(6px);
  }
  .menu-btn:hover { background: rgba(192,57,43,0.6); border-color: #fff; }

  /* 遊戲HUD */
  #hud {
    position: fixed; left: 12px; bottom: 12px; z-index: 6;
    background: rgba(0,0,0,0.45); padding: 10px 14px;
    border: 1px solid rgba(255,255,255,0.2); font-size: 13px;
    letter-spacing: 2px; display: none;
  }
  #tip {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    color: rgba(255,255,255,0.85); font-size: 12px;
    background: rgba(0,0,0,0.35); padding: 6px 14px; border-radius: 20px;
    z-index: 6; display: none;
  }

  /* 手機虛擬搖桿 */
  #touchPad {
    position: fixed; right: 20px; bottom: 90px;
    width: 140px; height: 140px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    z-index: 7; display: none;
  }
  #touchDot {
    position: absolute; left: 50%; top: 50%;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transform: translate(-50%, -50%);
  }

  /* 設定面板 */
  #settingsPanel {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 15;
  }
  #settingsPanel h2 { margin-bottom: 20px; letter-spacing: 4px; }
  #settingsPanel label {
    margin: 10px 0; font-size: 14px; letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="top-note">本作所有品牌皆為虛構諧仿</div>

<div id="startMenu">
  <div class="hk-stamp">香港</div>
  <h1>GTA</h1>
  <div class="sub">去香港狂飆</div>
  <button class="menu-btn" onclick="startGame()">開始遊戲</button>
  <button class="menu-btn" onclick="showControls()">操作說明</button>
  <button class="menu-btn" onclick="openSettings()">設定</button>
  <button class="menu-btn" onclick="alert('感謝支持，但此版本為免費同人展示。')">抖內支持</button>
</div>

<div id="settingsPanel">
  <h2>設定</h2>
  <label>雨天強度：<input id="rainRange" type="range" min="0" max="1" step="0.1" value="0.3"></label>
  <label>音樂：<input id="musicRange" type="range" min="0" max="1" step="0.1" value="0.5"></label>
  <button class="menu-btn" onclick="closeSettings()">返回</button>
</div>

<div id="hud">
  <div>速度：<span id="speed">0</span> km/h</div>
  <div>位置：香港·維港</div>
</div>
<div id="tip">落雨天路面濕滑，煞車距離會變長</div>

<div id="touchPad"><div id="touchDot"></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
let scene, camera, renderer, car, city = [];
let speed = 0, angle = 0, steer = 0;
const maxSpeed = 180, acceleration = 0.6, brake = 1.4, friction = 0.985;
const keys = {};
let gameStarted = false;

init();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);
  scene.fog = new THREE.Fog(0x0a0a1a, 80, 350);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  // 夜景光
  const ambient = new THREE.AmbientLight(0x445577, 0.6);
  scene.add(ambient);
  const dir = new THREE.DirectionalLight(0xfff2d0, 0.4);
  dir.position.set(30, 60, 20);
  scene.add(dir);

  // 地面
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1000, 1000),
    new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.9 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // 道路
  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(22, 1000),
    new THREE.MeshStandardMaterial({ color: 0x1a1a22 })
  );
  road.rotation.x = -Math.PI / 2;
  road.position.y = 0.01;
  scene.add(road);

  // 道路中線
  for (let i = -450; i < 450; i += 25) {
    const line = new THREE.Mesh(
      new THREE.PlaneGeometry(1.2, 12),
      new THREE.MeshStandardMaterial({ color: 0xffd55c, emissive: 0xffb347, emissiveIntensity: 0.6 })
    );
    line.rotation.x = -Math.PI / 2;
    line.position.set(0, 0.02, i);
    scene.add(line);
  }

  // 香港高樓
  createBuildings();

  // 車
  car = createCar();
  scene.add(car);

  // 燈光粒子
  createLights();

  window.addEventListener("resize", onResize);
  window.addEventListener("keydown", e => keys[e.code] = true);
  window.addEventListener("keyup", e => keys[e.code] = false);

  // 手機觸控
  const touchPad = document.getElementById("touchPad");
  const touchDot = document.getElementById("touchDot");
  let touchStart = null;

  if ("ontouchstart" in window) {
    touchPad.style.display = "block";
    touchPad.addEventListener("touchstart", e => {
      e.preventDefault();
      const t = e.touches[0];
      const rect = touchPad.getBoundingClientRect();
      touchStart = { x: t.clientX - rect.left, y: t.clientY - rect.top };
    });
    touchPad.addEventListener("touchmove", e => {
      e.preventDefault();
      if (!touchStart) return;
      const t = e.touches[0];
      const rect = touchPad.getBoundingClientRect();
      const dx = t.clientX - rect.left - touchStart.x;
      const dy = t.clientY - rect.top - touchStart.y;
      const dist = Math.min(50, Math.hypot(dx, dy));
      const a = Math.atan2(dy, dx);
      touchDot.style.left = `calc(50% + ${Math.cos(a) * dist}px)`;
      touchDot.style.top = `calc(50% + ${Math.sin(a) * dist}px)`;
      steer = Math.sin(a) * 1.2;
      if (dy < -20) speed = Math.min(maxSpeed, speed + 4);
      if (dy > 20) speed = Math.max(-60, speed - 4);
    });
    touchPad.addEventListener("touchend", () => {
      touchDot.style.left = "50%";
      touchDot.style.top = "50%";
      steer = 0;
    });
  }

  animate();
}

function createBuildings() {
  const hkColors = [0x22283a, 0x1a1f2e, 0x2b2f45, 0x151826];
  const glowColors = [0xffd55c, 0x74c0ff, 0xff9a3c, 0xff6b9d];

  for (let i = 0; i < 120; i++) {
    const w = 4 + Math.random() * 8;
    const d = 4 + Math.random() * 8;
    const h = 8 + Math.random() * 45;
    const building = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({
        color: hkColors[Math.floor(Math.random() * hkColors.length)],
        roughness: 0.7, metalness: 0.3
      })
    );

    const side = Math.random() > 0.5 ? 1 : -1;
    building.position.set(side * (18 + Math.random() * 80), h / 2, -500 + Math.random() * 1000);
    scene.add(building);

    // 窗光
    for (let y = 3; y < h - 2; y += 4) {
      for (let x = -w / 2 + 1; x < w / 2 - 1; x += 2) {
        if (Math.random() > 0.4) {
          const win = new THREE.Mesh(
            new THREE.PlaneGeometry(1.1, 1.4),
            new THREE.MeshStandardMaterial({
              color: glowColors[Math.floor(Math.random() * glowColors.length)],
              emissive: glowColors[Math.floor(Math.random() * glowColors.length)],
              emissiveIntensity: 0.8
            })
          );
          win.position.set(building.position.x + x * side, y, building.position.z + d / 2 * side * 0.95);
          win.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;
          scene.add(win);
        }
      }
    }
  }

  // ICC 主樓
  const icc = new THREE.Mesh(
    new THREE.BoxGeometry(14, 90, 14),
    new THREE.MeshStandardMaterial({ color: 0x1f2435, roughness: 0.5, metalness: 0.5 })
  );
  icc.position.set(-40, 45, 200);
  scene.add(icc);

  // IFC
  const ifc = new THREE.Mesh(
    new THREE.BoxGeometry(12, 70, 12),
    new THREE.MeshStandardMaterial({ color: 0x242a3d, roughness: 0.5, metalness: 0.5 })
  );
  ifc.position.set(50, 35, 300);
  scene.add(ifc);
}

function createCar() {
  const group = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2.2, 0.9, 4.5),
    new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4, metalness: 0.6 })
  );
  body.position.y = 0.7;
  group.add(body);

  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(2, 0.7, 1.8),
    new THREE.MeshStandardMaterial({ color: 0x1a1a1a })
  );
  roof.position.y = 1.55;
  group.add(roof);

  const redLight = new THREE.Mesh(
    new THREE.BoxGeometry(2.1, 0.3, 0.15),
    new THREE.MeshStandardMaterial({ color: 0xff2222, emissive: 0xff0000, emissiveIntensity: 1.2 })
  );
  redLight.position.set(0, 0.6, -2.35);
  group.add(redLight);

  return group;
}

function createLights() {
  for (let i = 0; i < 400; i++) {
    const light = new THREE.Mesh(
      new THREE.SphereGeometry(0.35, 8, 8),
      new THREE.MeshStandardMaterial({
        color: 0xffcc66, emissive: 0xffaa33, emissiveIntensity: 1
      })
    );
    light.position.set(
      (Math.random() - 0.5) * 200,
      2 + Math.random() * 80,
      (Math.random() - 0.5) * 1000
    );
    scene.add(light);
  }
}

function updateCar(dt) {
  if (keys["KeyW"] || keys["ArrowUp"]) speed = Math.min(maxSpeed, speed + acceleration);
  if (keys["KeyS"] || keys["ArrowDown"]) speed = Math.max(-40, speed - brake);
  if (keys["KeyA"] || keys["ArrowLeft"]) steer = -0.045;
  else if (keys["KeyD"] || keys["ArrowRight"]) steer = 0.045;
  else steer *= 0.85;

  speed *= friction;

  car.position.z -= speed * 0.015;
  car.rotation.y += steer * (0.3 + Math.abs(speed) * 0.004);

  document.getElementById("speed").innerText = Math.abs(Math.round(speed));
}

function animate() {
  requestAnimationFrame(animate);

  if (gameStarted) {
    updateCar();
    camera.position.set(car.position.x, 6, car.position.z + 12);
    camera.lookAt(car.position.x, 1, car.position.z - 10);
  }

  renderer.render(scene, camera);
}

function startGame() {
  document.getElementById("startMenu").style.display = "none";
  document.getElementById("hud").style.display = "block";
  document.getElementById("tip").style.display = "block";
  gameStarted = true;
}

function showControls() {
  alert("操作說明：\nW / ↑ 加速\nS / ↓ 煞車 / 倒車\nA / ← 左轉\nD / → 右轉\n手機：右下方虛擬搖桿控制方向與油門");
}

function openSettings() {
  document.getElementById("settingsPanel").style.display = "flex";
}

function closeSettings() {
  document.getElementById("settingsPanel").style.display = "none";
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>
</body>
</html>
